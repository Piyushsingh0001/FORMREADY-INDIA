<div class="upload-container" 
     appDragDrop 
     (fileDropped)="onFileDropped($event)" 
     (click)="browseFiles()">
     
  <div class="privacy-badge" style="display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; background: rgba(76, 175, 80, 0.1); color: #2e7d32; border-radius: 16px; font-size: 0.85rem; font-weight: 500; margin-bottom: 1rem;">
    <mat-icon style="font-size: 16px; width: 16px; height: 16px;">lock</mat-icon>
    <span>100% Private — Processed on your device</span>
  </div>

  <input type="file" 
         #fileInput 
         [accept]="acceptedTypes" 
         [multiple]="multiple"
         (change)="onFileSelected($event)" 
         style="display: none;" />
         
  <mat-icon class="upload-icon">cloud_upload</mat-icon>
  <h3>{{ title }}</h3>
  <p>{{ subtitle }}</p>
  
  <button mat-flat-button color="primary" class="browse-btn" (click)="browseFiles(); $event.stopPropagation()">
    Select File
  </button>
</div>
